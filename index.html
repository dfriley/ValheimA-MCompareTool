<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valheim Gear Compare</title>
<meta name="description" content="Compare Valheim armor loadouts and weapons side by side at any upgrade level, with full outfits, mixed pieces and set bonuses.">
<meta property="og:title" content="Valheim Gear Compare">
<meta property="og:description" content="Compare Valheim armor loadouts and weapons side by side at any upgrade level, with full outfits, mixed pieces and set bonuses.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dfriley.github.io/ValheimA-MCompareTool/">
<meta name="theme-color" content="#11181b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13 12 15 6.9-2 12-7.5 12-15V7z' fill='%23e08a3c'/%3E%3Cpath d='M16 8v16M11 13l5-5 5 5' stroke='%2311181b' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Grenze+Gotisch:wght@400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Valheim Gear Compare</h1>
      <p>Put two armor setups or two weapons head to head at any upgrade level. Use a full outfit or mix your own pieces, and set bonuses kick in on their own.</p>
    </div>
    <div class="global" id="controls">
      <span class="progress">Progress: <b id="progress-name"></b> <button type="button" class="btn link" id="change-progress" data-action="change-progress">Change</button></span>
      <label class="check"><input type="checkbox" id="over-max" data-action="over-max"> Allow levels past the in-game max</label>
      <button type="button" class="btn" id="reset" data-action="reset">Reset</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Compare">
    <button type="button" class="tab" role="tab" id="tab-armor" data-action="tab" data-tab="armor" aria-selected="true">Armor</button>
    <button type="button" class="tab" role="tab" id="tab-weapons" data-action="tab" data-tab="weapons" aria-selected="false">Weapons</button>
  </nav>
  <main id="app"></main>
  <footer id="source"></footer>
</div>
<script src="src/data.js"></script>
<script src="src/outfits.js"></script>
<script src="src/calc.js"></script>
<script src="src/app.js"></script>
</body>
</html>
